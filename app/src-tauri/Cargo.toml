[package]
# Neutral crate name so a rename never touches Rust. The display name comes from `productName`
# in tauri.conf.json (which also names the installed executable); README lists every place the
# name is defined, and tests/product_identity.rs keeps them in sync.
name = "tray-shell"
# The app version. tauri.conf.json has no version of its own, so Tauri reads this one.
version = "0.1.0"
description = "VersionBar tray shell: app lifecycle and narrowly scoped commands only"
authors = ["Michael Tahery"]
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "tray_shell"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
# Start with Windows (a per-user `Run` registry entry). Pinned exactly: it writes to the
# registry, so a version change should be a reviewed change.
tauri-plugin-autostart = "=2.7.0"
# Already in the tree through tauri; used directly for the IPC state shape and the scan
# output check (`raw_value` keeps scan results as untouched JSON text).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }

# App updates (desktop only, as the plugin supports nothing else). Pinned exactly like autostart:
# it downloads and launches installers, so a version change should be a reviewed change.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "=2.14.1"

[dev-dependencies]
# The mock runtime, for testing popup and second-launch handling without a real window.
tauri = { version = "2.12.5", features = ["tray-icon", "test"] }

[profile.release]
# Smaller installer; the shell does little work, so speed optimisations buy nothing.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
