# cargo-deny: licence, advisory, ban and source checks for the Rust shell (`npm run lint:rust`).

[graph]
# Only the target we ship. Linux GTK crates in Tauri's tree are not built for Windows and
# would otherwise raise advisories for code we never compile.
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# No advisory is ignored. Add an entry only with a written reason and an issue link.
ignore = []

[licenses]
# Licences compatible with shipping an MIT app (MPL-2.0 is file-level copyleft: fine for unmodified
# dependencies). Add one only after checking it.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# AGENTS.md hard rule 3: the webview must never be able to spawn arbitrary processes.
deny = [
  { name = "tauri-plugin-shell", reason = "No shell plugin (AGENTS.md hard rule 3)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
