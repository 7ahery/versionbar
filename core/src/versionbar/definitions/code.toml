#:schema ../../../../schema/definition.schema.json
id = "code"
name = "VS Code"
os = ["windows", "linux"]
binaries = ["code"]
version_args = ["--version"]
# Prints the version, a commit hash and the architecture on separate lines; only the first
# line is the version. On Windows `code` resolves to `code.cmd`, not the extensionless script.
version_regex = '^(?P<version>\d+\.\d+\.\d+\S*)'
