#:schema ../../../../schema/definition.schema.json
id = "cargo"
name = "Cargo"
os = ["windows", "linux"]
binaries = ["cargo"]
version_args = ["--version"]
# The commit hash and date after the version stay in `raw`.
version_regex = '^cargo (?P<version>\d+\.\d+\.\d+\S*)'

# cargo on PATH is usually a rustup proxy, which downloads a pinned or missing
# toolchain before answering. A scan must never install anything.
[env]
RUSTUP_AUTO_INSTALL = "0"
