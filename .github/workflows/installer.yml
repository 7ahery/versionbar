name: Installer

# Builds the per-user NSIS installer on a clean Windows runner and publishes it with
# SHA-256 checksums as a downloadable artifact, so a human can install it on a machine
# that has never seen the repo (the install proof in docs/app/install-proof.md).
#
# Push and dispatch runs are unsigned test builds (job `installer`). The release workflow
# (release-please.yml) calls this one with `sign-updater: true`, which runs job
# `release-installer` instead: it adds the updater artifact signature (`<installer>.sig`).
# The installer itself is unsigned in v1 either way (ADR 0010); the checksums are how users
# verify it.

on:
  # Pushes to work branches give an artifact without a PR; a dispatch-only workflow could
  # not be run before it reaches the default branch.
  push:
    branches: ["ticket/**", "integration/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (the release commit); defaults to the triggering commit.
        type: string
        default: ""
      sign-updater:
        description: Create and sign the updater artifact. Only the release workflow sets this.
        type: boolean
        default: false
    # The values live in the `release` environment, not the repository. A reusable workflow
    # only receives environment secrets the caller passes by name, and only in a job that
    # sets `environment`.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
    outputs:
      artifact:
        description: Name of the uploaded artifact holding the installer, checksums and signature.
        value: ${{ jobs.release-installer.outputs.artifact }}

permissions:
  contents: read

# A newer push may cancel a test build, but nothing may cancel a release build halfway.
concurrency:
  group: installer-${{ inputs.sign-updater && 'release' || github.ref }}
  cancel-in-progress: ${{ !inputs.sign-updater }}

jobs:
  installer:
    name: NSIS installer (windows-latest)
    if: ${{ !inputs.sign-updater }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/src-tauri
      - run: npm ci
      # The same root script a contributor runs; tauri.conf.json limits targets to NSIS and
      # its bundle.resources copies core/ (pyproject, uv.lock, .python-version, README, src)
      # from this same checkout, so the core in the installer matches the app's commit.
      - run: npm run build
      - uses: ./.github/actions/package-installer
        with:
          signed: false
          artifact: installer-${{ inputs.ref || github.sha }}

  # A separate job because only this one may name the `release` environment, which holds the
  # signing key and can be deployed from `main` only. A push to a work branch that edited
  # this file still could not reach the key.
  release-installer:
    name: Signed release installer (windows-latest)
    if: ${{ inputs.sign-updater }}
    runs-on: windows-latest
    environment: release
    outputs:
      artifact: installer-${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      # No Rust build cache: a published installer is built from scratch, so nothing an earlier
      # run left in a cache can end up in it. Releases are rare enough to pay the extra minutes.
      - run: npm ci
      # tauri.updater.conf.json only turns on bundle.createUpdaterArtifacts. It is passed to
      # the app workspace script directly because a nested `npm run` would eat `--config`.
      - name: Build and sign the updater artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty; check the release environment's secrets"
            exit 1
          fi
          npm run build -w app -- --config src-tauri/tauri.updater.conf.json 2>&1 | tee build.log
          # Tauri only warns when the key does not match plugins.updater.pubkey, but every
          # installed app would then reject the update, so the release must stop here.
          if grep -q 'does not match the public key' build.log; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY does not match plugins.updater.pubkey in tauri.conf.json"
            exit 1
          fi
      - uses: ./.github/actions/package-installer
        with:
          signed: true
          artifact: installer-${{ inputs.ref || github.sha }}
