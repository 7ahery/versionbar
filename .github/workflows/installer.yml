name: Installer

# Builds the per-user NSIS installer on a clean Windows runner and publishes it with
# SHA-256 checksums as a downloadable artifact, so a human can install it on a machine
# that has never seen the repo (the install proof in docs/app/install-proof.md).
#
# Push and dispatch runs are unsigned test builds. The release workflow (release-please.yml)
# calls this one with `sign-updater: true` and the updater key secrets, which adds the
# updater artifact signature (`<installer>.sig`) to the artifact. The installer itself is
# unsigned in v1 either way (ADR 0010); the checksums are how users verify it.

on:
  # Pushes to work branches give an artifact without a PR; a dispatch-only workflow could
  # not be run before it reaches the default branch.
  push:
    branches: ["ticket/**", "integration/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (the release commit); defaults to the triggering commit.
        type: string
        default: ""
      sign-updater:
        description: Create and sign the updater artifact. Only the release workflow sets this.
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
    outputs:
      artifact:
        description: Name of the uploaded artifact holding the installer, checksums and signature.
        value: ${{ jobs.installer.outputs.artifact }}

permissions:
  contents: read

# A newer push may cancel a test build, but nothing may cancel a release build halfway.
concurrency:
  group: installer-${{ inputs.sign-updater && 'release' || github.ref }}
  cancel-in-progress: ${{ !inputs.sign-updater }}

jobs:
  installer:
    name: NSIS installer (windows-latest)
    runs-on: windows-latest
    outputs:
      artifact: installer-${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/src-tauri
      - run: npm ci
      # The same root script a contributor runs; tauri.conf.json limits targets to NSIS and
      # its bundle.resources copies core/ (pyproject, uv.lock, .python-version, README, src)
      # from this same checkout, so the core in the installer matches the app's commit.
      # This step never sees the signing secrets, so push and dispatch builds cannot sign.
      - name: Build
        if: ${{ !inputs.sign-updater }}
        run: npm run build

      # tauri.updater.conf.json only turns on bundle.createUpdaterArtifacts. It is passed to
      # the app workspace script directly because a nested `npm run` would eat `--config`.
      - name: Build and sign the updater artifact
        if: ${{ inputs.sign-updater }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; a release cannot ship an unsigned update"
            exit 1
          fi
          npm run build -w app -- --config src-tauri/tauri.updater.conf.json 2>&1 | tee build.log
          # Tauri only warns when the key does not match plugins.updater.pubkey, but every
          # installed app would then reject the update, so the release must stop here.
          if grep -q 'does not match the public key' build.log; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY does not match plugins.updater.pubkey in tauri.conf.json"
            exit 1
          fi

      - name: Checksums
        shell: pwsh
        env:
          SIGNED: ${{ inputs.sign-updater }}
        run: |
          $dir = 'app/src-tauri/target/release/bundle/nsis'
          # -like rather than -Filter: Windows wildcards can match more than the pattern says.
          $installers = @(Get-ChildItem -Path $dir | Where-Object { $_.Name -like '*-setup.exe' })
          if ($installers.Count -ne 1) { throw "expected exactly one installer in $dir, found $($installers.Count)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $installers[0].FullName dist/
          $sig = "$($installers[0].FullName).sig"
          if ($env:SIGNED -eq 'true') {
            if (-not (Test-Path $sig)) { throw "signed build produced no $sig" }
            Copy-Item $sig dist/
          }
          # sha256sum format ("<hash> *<name>") so `sha256sum -c` and Get-FileHash both work.
          $name = $installers[0].Name
          $hash = (Get-FileHash -Algorithm SHA256 -Path "dist/$name").Hash.ToLower()
          "$hash *$name" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ inputs.ref || github.sha }}
          path: dist/
          if-no-files-found: error
